<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossworlds BCE — Combat Atlas</title>
<style>
:root {
  --bg:        #06080f;
  --surf:      #0b0f1a;
  --panel:     #0f1422;
  --border:    #1c2540;
  --border2:   #2c3860;
  --text:      #b8c8e0;
  --dim:       #566070;
  --gold:      #e8c040;
  --gold-d:    #6a5010;
  --dmg:       #e05520;
  --dmg-d:     rgba(224,85,32,.18);
  --heal:      #28c060;
  --heal-d:    rgba(40,192,96,.18);
  --sup:       #3080e0;
  --sup-d:     rgba(48,128,224,.18);
  --ult:       rgba(232,192,64,.12);
  --warden:    #4a90e2;
  --ironclad:  #f0a020;
  --shadow:    #9b59b6;
  --cleric:    #2ecc71;
  --arcanist:  #e74c3c;
  --radius:    6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
  font-size:14px;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ── HEADER ── */
header{background:var(--surf);border-bottom:1px solid var(--border);padding:0 24px;flex-shrink:0;}
.hd-top{display:flex;align-items:center;gap:16px;padding:12px 0 8px;}
.hd-logo{font-size:22px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(135deg,#e8c040,#a080f0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hd-tag{font-size:10px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;}
.hd-phase{margin-left:auto;font-size:11px;color:var(--dim);padding:4px 10px;
  border:1px solid var(--border);border-radius:20px;}
.class-nav{display:flex;gap:0;}
.ctab{padding:9px 22px;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:.5px;
  color:var(--dim);border-bottom:2px solid transparent;transition:all .15s;border-top:none;border-left:none;border-right:none;background:none;}
.ctab:hover{color:var(--text);}
.ctab.on{border-bottom-color:var(--cc,#fff);color:var(--cc,#fff);}

/* ── MAIN LAYOUT ── */
.main{display:flex;flex:1;min-height:0;}

/* ── GRID AREA ── */
.grid-wrap{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.section-head{padding:14px 20px 6px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);flex-shrink:0;}
.ability-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 20px 12px;flex-shrink:0;}
.sep{height:1px;background:var(--border);margin:4px 20px 16px;}

/* ── ABILITY CARD ── */
.acard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:11px 11px 9px;cursor:pointer;transition:border-color .12s,transform .12s;position:relative;}
.acard:hover{border-color:var(--border2);transform:translateY(-1px);}
.acard.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(232,192,64,.2);}
.acard.built{border-color:var(--cc,var(--gold));}
.acard.syn-glow{box-shadow:0 0 18px rgba(232,192,64,.35);}
.acard.ult-card{background:linear-gradient(160deg,var(--panel) 70%,var(--ult));}
.ch{display:flex;align-items:flex-start;gap:8px;margin-bottom:5px;}
.ci{width:34px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.cn{font-size:12.5px;font-weight:700;color:#d8e8f8;line-height:1.25;}
.cm{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;}
.tag{font-size:9.5px;padding:1px 5px;border-radius:3px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.td{background:var(--dmg-d);color:#e07050;}
.th{background:var(--heal-d);color:#50d080;}
.ts{background:var(--sup-d);color:#70b0f0;}
.tc{background:rgba(255,255,255,.05);color:var(--dim);}
.tv{background:rgba(224,85,32,.1);color:#d07050;}
.tu{background:var(--ult);color:var(--gold);border:1px solid rgba(232,192,64,.25);}
.cd{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.add-btn{position:absolute;top:8px;right:8px;width:18px;height:18px;background:rgba(255,255,255,.05);
  border:1px solid var(--border2);border-radius:3px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:10px;color:var(--dim);transition:all .1s;}
.add-btn:hover{background:var(--gold-d);color:var(--gold);}
.add-btn.on{background:var(--gold-d);color:var(--gold);border-color:var(--gold);}
.ult-star{position:absolute;top:6px;left:6px;width:13px;height:13px;background:var(--gold-d);
  border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:7px;color:var(--gold);}

/* ── DETAIL PANEL ── */
.detail{width:294px;background:var(--surf);border-left:1px solid var(--border);
  overflow-y:auto;flex-shrink:0;padding:18px;}
.dp-empty{color:var(--dim);font-size:13px;text-align:center;margin-top:70px;line-height:2;}
.dp-icon{width:60px;height:60px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:30px;margin:0 auto 12px;}
.dp-name{font-size:17px;font-weight:800;color:#fff;text-align:center;margin-bottom:3px;}
.dp-cls{font-size:10px;text-align:center;letter-spacing:1px;text-transform:uppercase;
  color:var(--dim);margin-bottom:14px;}
.dp-tags{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
.dp-desc{font-size:12px;color:var(--text);line-height:1.65;margin-bottom:14px;}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.sl{color:var(--dim);}
.sv{color:#fff;font-weight:600;}
.syn-sec{margin-top:16px;}
.syn-head{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;}
.syn-item{background:var(--panel);border:1px solid var(--border);border-radius:4px;
  padding:7px 9px;margin-bottom:5px;font-size:12px;}
.syn-item.active{border-color:var(--gold);box-shadow:0 0 8px rgba(232,192,64,.18);}
.sp{color:var(--gold);font-weight:700;}
.sd{color:var(--dim);margin-top:2px;font-size:11px;}
.dp-add{margin-top:16px;padding:8px;background:var(--panel);border:1px solid var(--border2);
  border-radius:4px;cursor:pointer;text-align:center;font-size:12px;font-weight:600;
  color:var(--dim);transition:all .15s;}
.dp-add:hover,.dp-add.on{background:var(--gold-d);color:var(--gold);border-color:var(--gold);}

/* ── BUILD BAR ── */
.build{background:var(--surf);border-top:1px solid var(--border);padding:11px 20px;
  display:flex;align-items:center;gap:10px;flex-shrink:0;}
.bl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);flex-shrink:0;}
.bslots{display:flex;gap:8px;flex:1;min-width:0;}
.bslot{flex:1;height:52px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  display:flex;align-items:center;padding:0 10px;gap:8px;cursor:pointer;transition:border-color .15s;min-width:0;}
.bslot:hover{border-color:var(--border2);}
.bslot.on{border-color:var(--cc,var(--gold));}
.bsi{font-size:20px;flex-shrink:0;}
.bsn{font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bsc{font-size:10px;color:var(--dim);}
.bse{color:var(--dim);font-size:11.5px;}
.syn-pill{background:var(--panel);border:1px solid var(--border);border-radius:4px;
  padding:5px 10px;font-size:11px;white-space:nowrap;flex-shrink:0;}
.syn-cnt{color:var(--gold);font-weight:800;}
.bclear{font-size:11px;color:var(--dim);cursor:pointer;padding:5px 10px;
  border:1px solid var(--border);border-radius:4px;white-space:nowrap;flex-shrink:0;}
.bclear:hover{border-color:var(--border2);color:var(--text);}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
::-webkit-scrollbar-track{background:transparent;}

/* class color helper */
.cc-warden   { --cc: var(--warden);   }
.cc-ironclad { --cc: var(--ironclad); }
.cc-shadow   { --cc: var(--shadow);   }
.cc-cleric   { --cc: var(--cleric);   }
.cc-arcanist { --cc: var(--arcanist); }

/* Phase preview section */
.phase-preview{padding:16px 20px;}
.phase-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
.phase-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;opacity:.75;}
.phase-card:hover{opacity:1;border-color:var(--border2);}
.ph-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;
  margin-bottom:5px;}
.ph-name{font-size:13.5px;font-weight:700;color:#fff;margin-bottom:5px;}
.ph-desc{font-size:11px;color:var(--dim);line-height:1.6;}
</style>
</head>
<body>
<header>
  <div class="hd-top">
    <div class="hd-logo">⚔ CROSSWORLDS BCE</div>
    <div class="hd-tag">Combat Atlas v1</div>
    <div class="hd-phase">Phase 1 · Live</div>
  </div>
  <div class="class-nav" id="cnav"></div>
</header>

<div class="main">
  <div class="grid-wrap" id="gw">
    <div class="section-head">SHARED ABILITIES — AVAILABLE TO ALL HEROES</div>
    <div class="ability-grid" id="sgrid"></div>
    <div class="sep"></div>
    <div class="section-head" id="clabel">CLASS ABILITIES</div>
    <div class="ability-grid" id="cgrid"></div>
    <div class="sep" style="margin-top:4px"></div>
    <div class="section-head">COMING IN FUTURE PHASES</div>
    <div class="phase-preview" style="padding-top:0">
      <div class="phase-grid" id="pgrid"></div>
    </div>
  </div>
  <div class="detail" id="detail"><div class="dp-empty">Click any ability to inspect stats, synergies, and build interactions.<br><br>Use ⊕ to add abilities to your 4-slot build bar.</div></div>
</div>

<div class="build">
  <div class="bl">BUILD</div>
  <div class="bslots" id="bslots"></div>
  <div class="syn-pill" id="spill"><span class="syn-cnt">0</span> synergies</div>
  <div class="bclear" onclick="clearBuild()">✕ Clear</div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   DATA — mirrors AbilityCaster.cs spellbook exactly
══════════════════════════════════════════════════════════════════════════ */

const CLASSES = [
  {id:0,name:"Warden",    cls:"warden",  color:"#4a90e2", role:"Construct Tactician",
   lore:"Deploys autonomous constructs, commands them with precision, and rallies allies with aura buffs. Win through battlefield control.",
   indices:[8,9,10,11,12]},
  {id:1,name:"Ironclad",  cls:"ironclad",color:"#f0a020", role:"Iron Vanguard",
   lore:"Absorbs punishment, punishes aggression, and locks down key targets. The wall every team needs.",
   indices:[13,14,15,16,17,18]},
  {id:2,name:"Shadowblade",cls:"shadow", color:"#9b59b6", role:"Void Infiltrator",
   lore:"Vanishes, repositions, and strikes from darkness for lethal burst windows. High risk, decisive payoff.",
   indices:[29,30,31]},
  {id:3,name:"Cleric",    cls:"cleric",  color:"#2ecc71", role:"Soul Warden",
   lore:"Sustains the team through heals, shields, revives, and the rare power to rewind time itself.",
   indices:[23,24,25,26,27,28]},
  {id:4,name:"Arcanist",  cls:"arcanist",color:"#e74c3c", role:"Void Mage",
   lore:"Reshapes the battlefield with gravitational singularities and chain lightning. Master of area burst.",
   indices:[19,20,21,22]},
];

const SHARED = [0,1,2,3,4,5,6,7];

const AB = [
  // ── SHARED 0-7 ─────────────────────────────────────────────────────────
  {id:0, name:"Runic Sentinel",   e:"🤖",cat:"support",shape:"Circle", range:10,cd:6,  dmg:0,   siz:1.5,
   desc:"Deploy a self-targeting construct turret. Auto-attacks nearby enemies. Up to 3 active for Warden. Redirect via Spirit Redirect.",tags:["turret","deployable"]},
  {id:1, name:"Void Bolt",        e:"💥",cat:"damage", shape:"Cone",   range:8, cd:3,  dmg:10,  maxDmg:30,
   desc:"Chargeable void energy cone. Scales 10→30 damage, cone widens 1.6×. +50% bonus when breaking Shadow Veil stealth.",tags:["chargeable","veil-synergy"]},
  {id:2, name:"Mending Circle",   e:"💚",cat:"heal",   shape:"Circle", range:6, cd:5,  dmg:0,   siz:3,
   desc:"Place a 3-unit healing zone. All allies within radius are continuously restored while inside.",tags:["zone","aoe-heal"]},
  {id:3, name:"Storm Lash",       e:"⚡",cat:"damage", shape:"Rect",   range:10,cd:4,  dmg:15,  maxDmg:50,
   desc:"Chargeable lightning beam in a line. Fully charged hits 50 damage; beam widens 1.8×.",tags:["chargeable","line"]},
  {id:4, name:"Ember Surge",      e:"🔥",cat:"damage", shape:"Circle", range:12,cd:4,  dmg:20,  maxDmg:45,
   desc:"Charged AoE fireburst. Uncharged 20 dmg, full charge 45 dmg, radius 2×. Perfect for grouped enemies.",tags:["chargeable","aoe","fire"]},
  {id:5, name:"Mind Spike",       e:"🧠",cat:"damage", shape:"Circle", range:10,cd:5,  dmg:35,  siz:2.5,
   desc:"35 psychic damage. Deals +50% bonus if target just had Shadowblade's veil broken — prime execute.",tags:["stealth-synergy","burst"]},
  {id:6, name:"Binding Wave",     e:"🌀",cat:"damage", shape:"Circle", range:5, cd:6,  dmg:15,  siz:5,
   desc:"Wide shockwave that roots nearby enemies and deals 15 damage. Excellent setup for follow-up AoE.",tags:["root","crowd-control","setup"]},
  {id:7, name:"Arcane Ward",      e:"🛡",cat:"support",shape:"Self",   range:0, cd:8,  absorb:50,dur:5,
   desc:"Instant 50-absorb personal shield lasting 5 seconds. No aim needed. Use before incoming burst.",tags:["shield","instant","defensive"]},

  // ── WARDEN 8-12 ────────────────────────────────────────────────────────
  {id:8, name:"Runic Snare",      e:"💣",cat:"damage", shape:"Circle", range:8, cd:5,  dmg:40,  siz:1,
   desc:"Plant a proximity rune trap. Detonates for 40 damage on enemy contact. Combo with Shadow Veil for invisible mine placement.",tags:["trap","deployable","warden"]},
  {id:9, name:"Battle Hymn",      e:"🎺",cat:"support",shape:"Circle", range:0, cd:12, dmg:0,   siz:6,
   desc:"Grants all nearby allies +30% CDR for 8 seconds. Substantially shortens Conjurer's Surge ultimate cooldown.",tags:["aura","cdr","team","warden"]},
  {id:10,name:"Spirit Redirect",  e:"🎯",cat:"support",shape:"Circle", range:12,cd:8,  dmg:0,   siz:1,
   desc:"Redirect all active Runic Sentinels to focus a single enemy target for 6 seconds. Peak focus-fire.",tags:["turret","command","warden"]},
  {id:11,name:"Mend",             e:"💉",cat:"heal",   shape:"Circle", range:6, cd:6,  dmg:0,   heal:40,
   desc:"Single-target direct heal for 40 HP with instant debuff cleanse. Quick targeted recovery.",tags:["single-target","cleanse","warden"]},
  {id:12,name:"Conjurer's Surge", e:"⚙️",cat:"support",shape:"Self",   range:0, cd:45, dmg:0,
   desc:"ULTIMATE: Instantly activates ALL active constructs at peak power. Combined with Battle Hymn reduces cooldown ~14s.",tags:["ultimate","overload","warden"]},

  // ── IRONCLAD 13-18 ─────────────────────────────────────────────────────
  {id:13,name:"Counter Blow",     e:"⚔️",cat:"support",shape:"Cone",   range:8, cd:10, dmg:60,
   desc:"Absorb incoming hits for 3s then release as 60 damage cone. The more you absorb, the harder you hit back.",tags:["absorb","reactive","ironclad"]},
  {id:14,name:"Gravity Slam",     e:"🌑",cat:"support",shape:"Circle", range:10,cd:7,  dmg:0,   siz:4,pull:4,pullDur:2,
   desc:"Pull ALL enemies in 4-unit radius to impact point for 2 seconds — no direct damage. Perfect AoE setup.",tags:["pull","crowd-control","setup","ironclad"]},
  {id:15,name:"Shieldwall Charge",e:"🏃",cat:"damage", shape:"Rect",   range:6, cd:6,  dmg:25,
   desc:"Charge forward 6 units, dealing 25 damage + stagger + 3 Threat stacks. Drives enemies into AoE zones.",tags:["dash","stagger","threat","ironclad"]},
  {id:16,name:"Stalwart Stance",  e:"🗿",cat:"support",shape:"Self",   range:0, cd:14, dmg:0,   dur:6,
   desc:"Stationary: 40% damage reduction + 3× Threat generation for 6 seconds. Pair with Rune Chain to lock down a target.",tags:["stance","tank","dr","ironclad"]},

   desc:"Leash one enemy for 5 seconds. Absorbs 15% of their attacks on your allies. Hard counter to mobile assassins.",tags:["leash","tank","ironclad"]},
  {id:18,name:"Iron Rampart",     e:"🧱",cat:"support",shape:"Rect",   range:8, cd:50, dmg:0,
   desc:"ULTIMATE: Full-width stone rune wall blocks all projectiles for 10 seconds. Decisive zone control.",tags:["ultimate","wall","zone","ironclad"]},

  // ── ARCANIST 19-22 ─────────────────────────────────────────────────────
  {id:19,name:"Arcane Step",      e:"✨",cat:"support",shape:"Circle", range:10,cd:4,  dmg:0,
   desc:"Teleport up to 10 units in any direction. Fastest repositioning in the game. Teleport behind enemies for Forked Lightning backline chain.",tags:["teleport","mobility","arcanist"]},
  {id:20,name:"Void Maw",         e:"🕳",cat:"damage", shape:"Circle", range:10,cd:9,  dmg:20,  siz:8,pull:8,pullDur:3,
   desc:"Singularity pulls enemies 3 seconds then bursts 20 AoE damage. Cluster targets for Forked Lightning or Mind Spike.",tags:["singularity","pull","aoe","arcanist"]},
  {id:21,name:"Forked Lightning", e:"⚡",cat:"damage", shape:"Circle", range:10,cd:7,  dmg:30,  chain:4,falloff:5,
   desc:"Chain lightning jumps up to 4 enemies: 30/25/20/15 per jump. Peak value vs. clustered targets from Void Maw.",tags:["chain","multi-target","arcanist"]},
  {id:22,name:"Collapsing Void",  e:"🌌",cat:"damage", shape:"Circle", range:14,cd:50, dmg:60,  siz:12,
   desc:"ULTIMATE: 12-unit pull for 3 seconds, then 60 AoE burst + Exposed/Weakened. Feeds Dark Harvest for enormous payoff.",tags:["ultimate","singularity","exposed","arcanist"]},

  // ── CLERIC 23-28 ───────────────────────────────────────────────────────
  {id:23,name:"Soul Bond",        e:"🔗",cat:"support",shape:"Circle", range:8, cd:9,  dmg:0,   dur:5,
   desc:"Tether an ally: all their damage reroutes to you for 5 seconds. Combine with Sacred Aegis to scale your own shield while protecting them.",tags:["redirect","tether","cleric"]},
  {id:24,name:"Spirit Wisps",     e:"🌟",cat:"heal",   shape:"Circle", range:10,cd:7,  dmg:0,   siz:2,
   desc:"Release healing orbs drifting to the nearest ally. Orbs chip enemies they pass through for minor damage.",tags:["orb","mobile-heal","cleric"]},

  {id:26,name:"Sacred Aegis",     e:"💠",cat:"support",shape:"Circle", range:8, cd:10, absorb:20,dur:8,
   desc:"Shield ally starting at 20 absorb, growing +10 per incoming hit over 8 seconds. Pairs perfectly with Soul Bond.",tags:["shield","scaling","reactive","cleric"]},
  {id:27,name:"Dispel",           e:"🌬",cat:"support",shape:"Circle", range:8, cd:7,  dmg:0,
   desc:"Instant full debuff cleanse on any ally. Hard counter to Silence Ward and stacked DoT effects.",tags:["cleanse","instant","counter","cleric"]},
  {id:28,name:"Temporal Grace",   e:"⏱",cat:"heal",   shape:"Self",   range:0, cd:60, dmg:0,
   desc:"ULTIMATE: Rewind the entire team 5 seconds — HP, position, and debuffs all restored. Most powerful reset in the game.",tags:["ultimate","rewind","aoe-heal","cleric"]},

  // ── SHADOWBLADE 29-31 ──────────────────────────────────────────────────
  {id:29,name:"Shadow Veil",      e:"👁",cat:"support",shape:"Self",   range:0, cd:10, dmg:0,   dur:4,
   desc:"Full invisibility for 4 seconds. Breaking stealth with Void Bolt or Mind Spike grants +50% damage on that strike.",tags:["stealth","invisibility","veil-break","shadow"]},
  {id:30,name:"Silence Ward",     e:"🔇",cat:"support",shape:"Circle", range:10,cd:12, dmg:0,   siz:5,dur:5,
   desc:"Silence all enemy abilities in the zone for 5 seconds. Silenced enemies stack debuffs — amplifies Dark Harvest.",tags:["silence","debuff","zone","shadow"]},
  {id:31,name:"Dark Harvest",     e:"💀",cat:"damage", shape:"Circle", range:8, cd:40, dmg:20,  siz:8,
   desc:"ULTIMATE: Consume ALL debuffs on enemies in range for 20 damage per stack. Collapsing Void → Silence Ward = maximum stacks.",tags:["ultimate","debuff-consume","burst","shadow"]},
];

const SYNERGIES = [
  {a:29,b:5,  label:"Veil Break",      desc:"Shadow Veil → break stealth with Mind Spike for +50% damage on that hit"},
  {a:29,b:1,  label:"Void Break",       desc:"Shadow Veil → break stealth with Void Bolt for +50% damage bonus"},
  {a:22,b:31, label:"Exposed+Harvest",  desc:"Collapsing Void applies Exposed/Weakened → Dark Harvest for devastating stacks"},
  {a:20,b:21, label:"Cluster+Chain",    desc:"Void Maw groups enemies → Forked Lightning chains through all of them"},
  {a:14,b:21, label:"Gravity+Chain",    desc:"Gravity Slam pulls targets together → Forked Lightning chain maximized"},
  {a:14,b:5,  label:"Gravity+Spike",    desc:"Gravity Slam clusters enemies → Mind Spike picks off center target"},
  {a:14,b:4,  label:"Gravity+Surge",    desc:"Gravity Slam → Ember Surge detonates the cluster for amplified AoE"},
  {a:9, b:12, label:"CDR+Ultimate",     desc:"Battle Hymn +30% CDR → Conjurer's Surge cooldown drops from 45s to ~31s"},
  {a:9, b:0,  label:"Hymn+Sentinels",   desc:"Battle Hymn CDR accelerates Runic Sentinel redeploy cycle"},
  {a:12,b:0,  label:"Surge Overload",   desc:"Conjurer's Surge activates all active Runic Sentinels simultaneously at full power"},
  {a:10,b:0,  label:"Redirect+Turrets", desc:"Spirit Redirect focuses all Runic Sentinels on one target"},
  {a:30,b:31, label:"Silence+Harvest",  desc:"Silence Ward stacks debuffs on silenced enemies → Dark Harvest consumes them"},
  {a:8, b:29, label:"Trap+Veil",        desc:"Plant Runic Snare while invisible under Shadow Veil"},
  {a:17,b:16, label:"Chain+Stance",     desc:"Rune Chain leashes target → Stalwart Stance holds threat and DR combo"},
  {a:23,b:26, label:"Bond+Aegis",       desc:"Soul Bond redirects damage to Cleric → Sacred Aegis scales up each hit"},
  {a:19,b:21, label:"Step+Lightning",   desc:"Arcane Step repositions behind enemies → Forked Lightning chains through backline"},
  {a:6, b:4,  label:"Bind+Surge",       desc:"Binding Wave roots cluster → Ember Surge detonates before they escape"},
  {a:15,b:14, label:"Charge+Slam",      desc:"Shieldwall Charge drives enemies into Gravity Slam pull zone"},
  {a:23,b:28, label:"Bond+Rewind",      desc:"Soul Bond active → Temporal Grace rewinds: protected ally returns at previous HP"},
  {a:20,b:5,  label:"Maw+Spike",        desc:"Void Maw clusters enemies for a high-value centered Mind Spike"},
  {a:25,b:28, label:"Spark+Rewind",     desc:"Temporal Grace rewinds HP after Divine Spark revive, protecting the revived ally"},
];

const PHASES = [
  {phase:"Phase 2",color:"#4a90e2",name:"Guild Wars & Marketplace",
   desc:"Guild formation, guild vs. guild arena matches, player-to-player item trading, and an auction marketplace."},
  {phase:"Phase 2",color:"#9b59b6",name:"Talent Trees",
   desc:"Each hero gains a 30-node passive talent tree — spec into Offense, Defense, or Utility branches."},
  {phase:"Phase 2",color:"#f0a020",name:"Quest System",
   desc:"Story-driven quest chains, repeatable daily bounties, and world events that reward unique gear."},
  {phase:"Phase 3",color:"#e74c3c",name:"World Bosses",
   desc:"20-player raid encounters against colossal void entities. Phase-based mechanics, custom loot tables."},
  {phase:"Phase 3",color:"#2ecc71",name:"Dungeon Instances",
   desc:"5-player instanced dungeons with unique boss abilities. Difficulty tiers from Normal to Void difficulty."},
  {phase:"Phase 3",color:"#e8c040",name:"Status Effect Engine",
   desc:"Expanded debuff system: Burn, Freeze, Corruption, Silence, Expose, Weaken, Stagger chains and counters."},
];

/* ══════════════════════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════════════════════ */
let selClass = 0;
let selAb = null;
let build = [null,null,null,null];
let nxt = 0;

/* ══════════════════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════════════════ */
function init(){
  buildNav(); buildBuild(); renderAll();
  buildPhases();
}

function buildNav(){
  const n = document.getElementById('cnav');
  CLASSES.forEach((c,i)=>{
    const t = document.createElement('div');
    t.className='ctab cc-'+c.cls+(i===0?' on':'');
    t.style.setProperty('--cc',c.color);
    t.textContent=c.name;
    t.onclick=()=>selCls(i);
    n.appendChild(t);
  });
}

function buildPhases(){
  const g = document.getElementById('pgrid');
  PHASES.forEach(p=>{
    const el=document.createElement('div');
    el.className='phase-card';
    el.innerHTML=`<div class="ph-label" style="color:${p.color}">${p.phase}</div>
      <div class="ph-name">${p.name}</div>
      <div class="ph-desc">${p.desc}</div>`;
    g.appendChild(el);
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════════════════════════════════ */
function selCls(id){
  selClass=id;
  document.querySelectorAll('.ctab').forEach((t,i)=>{
    t.classList.toggle('on',i===id);
  });
  renderAll();
}

function renderAll(){
  const c=CLASSES[selClass];
  document.getElementById('clabel').textContent=
    c.name.toUpperCase()+' CLASS ABILITIES — '+c.role;
  renderGrid('sgrid',SHARED);
  renderGrid('cgrid',c.indices);
  buildBuild();
  updateSyn();
}

function renderGrid(id,ids){
  const g=document.getElementById(id);
  g.innerHTML='';
  const sorted=[...ids].sort((a,b)=>(AB[a].cd>=40?1:0)-(AB[b].cd>=40?1:0));
  sorted.forEach(i=>g.appendChild(makeCard(i)));
}

function makeCard(id){
  const ab=AB[id];
  const inB=build.includes(id);
  const isSel=selAb===id;
  const isUlt=ab.cd>=40;
  const hasSyn=activeSyns(id).length>0&&inB;

  const cls=CLASSES[selClass];
  const cc=cls.color;

  const card=document.createElement('div');
  card.className='acard'+(isSel?' sel':'')+(inB?' built':'')+(isUlt?' ult-card':'')+(hasSyn?' syn-glow':'');
  card.style.setProperty('--cc',cc);
  card.dataset.id=id;
  card.onclick=e=>{if(e.target.classList.contains('add-btn'))return;pickAb(id);};

  const catC={damage:'#e07050',heal:'#50d080',support:'#70b0f0'}[ab.cat]||'#fff';
  const catB={damage:'var(--dmg-d)',heal:'var(--heal-d)',support:'var(--sup-d)'}[ab.cat]||'';
  const catTag={damage:'td',heal:'th',support:'ts'}[ab.cat]||'';

  card.innerHTML=`
    ${isUlt?'<div class="ult-star">★</div>':''}
    <div class="ch">
      <div class="ci" style="background:${catB};color:${catC}">${ab.e}</div>
      <div>
        <div class="cn">${ab.name}</div>
        <div class="cm">
          <span class="tag ${catTag}">${ab.cat}</span>
          <span class="tag tc">⏱${ab.cd}s</span>
          ${ab.dmg?`<span class="tag tv">${ab.dmg}${ab.maxDmg?'→'+ab.maxDmg:''}</span>`:''}
          ${isUlt?'<span class="tag tu">ULTIMATE</span>':''}
        </div>
      </div>
    </div>
    <div class="cd">${ab.desc}</div>
    <div class="add-btn ${inB?'on':''}" onclick="togBuild(${id},event)">${inB?'✓':'⊕'}</div>`;
  return card;
}

/* ══════════════════════════════════════════════════════════════════════════
   DETAIL PANEL
══════════════════════════════════════════════════════════════════════════ */
function pickAb(id){
  selAb=id; renderAll(); renderDetail(id);
}

function renderDetail(id){
  const ab=AB[id];
  const cls=whichCls(id);
  const syns=SYNERGIES.filter(s=>s.a===id||s.b===id);
  const inB=build.includes(id);
  const catC={damage:'#e07050',heal:'#50d080',support:'#70b0f0'}[ab.cat]||'#fff';
  const catB={damage:'rgba(224,85,32,.12)',heal:'rgba(40,192,96,.12)',support:'rgba(48,128,224,.12)'}[ab.cat]||'';
  const catTag={damage:'td',heal:'th',support:'ts'}[ab.cat]||'';
  const isUlt=ab.cd>=40;

  let stats='';
  if(ab.dmg)   stats+=stat('Damage',`<span style="color:#e07050">${ab.dmg}${ab.maxDmg?' → '+ab.maxDmg+' (charged)':''}</span>`);
  if(ab.maxDmg)stats+=stat('Type','Chargeable');
  if(ab.heal)  stats+=stat('Heal',`<span style="color:#50d080">${ab.heal} HP</span>`);
  if(ab.absorb)stats+=stat('Shield',`<span style="color:#70b0f0">${ab.absorb} absorb</span>`);
  if(ab.range) stats+=stat('Range',ab.range+'u');
  if(ab.siz)   stats+=stat('AoE Radius',(ab.siz/2).toFixed(1)+'u');
  if(ab.pull)  stats+=stat('Pull',ab.pull+'u for '+ab.pullDur+'s');
  if(ab.dur)   stats+=stat('Duration',ab.dur+'s');
  if(ab.chain) stats+=stat('Chain',ab.chain+' targets, −'+ab.falloff+' per jump');
  stats+=stat('Cooldown',`${ab.cd}s${isUlt?' <span style="color:var(--gold)">★ ULTIMATE</span>':''}`);
  stats+=stat('Shape',ab.shape);

  const synHtml=syns.length===0?'':`
    <div class="syn-sec">
      <div class="syn-head">SYNERGIES (${syns.length})</div>
      ${syns.map(s=>{
        const pid=s.a===id?s.b:s.a;
        const p=AB[pid];
        const pInB=build.includes(pid)&&inB;
        return`<div class="syn-item${pInB?' active':''}">
          <div class="sp">${p.e} ${p.name}${pInB?' ✓ active':''}</div>
          <div class="sd">${s.desc}</div>
        </div>`;
      }).join('')}
    </div>`;

  const tagsHtml=(ab.tags||[]).map(t=>`<span class="tag tc">${t}</span>`).join('');

  document.getElementById('detail').innerHTML=`
    <div class="dp-icon" style="background:${catB};color:${catC};font-size:30px">${ab.e}</div>
    <div class="dp-name">${ab.name}</div>
    <div class="dp-cls" style="color:${cls?cls.color:'var(--dim)'}">${cls?cls.name:'Shared'} · ${ab.cat.toUpperCase()}</div>
    <div class="dp-tags">${tagsHtml}</div>
    <div class="dp-desc">${ab.desc}</div>
    ${stats}
    ${synHtml}
    <div class="dp-add ${inB?'on':''}" onclick="togBuild(${id},event)">
      ${inB?'✓ In Build — Click to Remove':'⊕ Add to Build'}
    </div>`;
}

function stat(l,v){return`<div class="stat"><span class="sl">${l}</span><span class="sv">${v}</span></div>`;}

function whichCls(id){
  if(SHARED.includes(id))return null;
  return CLASSES.find(c=>c.indices.includes(id))||null;
}

/* ══════════════════════════════════════════════════════════════════════════
   BUILD
══════════════════════════════════════════════════════════════════════════ */
function buildBuild(){
  const c=CLASSES[selClass];
  const el=document.getElementById('bslots');
  el.innerHTML='';
  for(let i=0;i<4;i++){
    const slot=document.createElement('div');
    slot.className='bslot'+(build[i]!==null?' on':'');
    slot.style.setProperty('--cc',c.color);
    slot.onclick=()=>{if(build[i]!==null){build[i]=null;if(selAb!==null)renderDetail(selAb);renderAll();}};
    if(build[i]!==null){
      const ab=AB[build[i]];
      slot.innerHTML=`<div class="bsi">${ab.e}</div><div>
        <div class="bsn">${ab.name}</div>
        <div class="bsc">⏱${ab.cd}s${ab.dmg?' · '+ab.dmg+(ab.maxDmg?'→'+ab.maxDmg:'')+'dmg':''}</div></div>`;
    } else {
      slot.innerHTML=`<div class="bsi" style="opacity:.18">⬡</div><div class="bse">Slot ${i+1}</div>`;
    }
    el.appendChild(slot);
  }
}

function togBuild(id,e){
  e.stopPropagation();
  const idx=build.indexOf(id);
  if(idx!==-1){build[idx]=null;}
  else{
    let placed=false;
    for(let i=0;i<4;i++){if(build[i]===null){build[i]=id;placed=true;break;}}
    if(!placed){build[nxt]=id;nxt=(nxt+1)%4;}
  }
  if(selAb!==null)renderDetail(selAb);
  renderAll();
}

function clearBuild(){build=[null,null,null,null];if(selAb!==null)renderDetail(selAb);renderAll();}

function activeSyns(id){
  return SYNERGIES.filter(s=>{
    if(s.a!==id&&s.b!==id)return false;
    const p=s.a===id?s.b:s.a;
    return build.includes(id)&&build.includes(p);
  });
}

function updateSyn(){
  const seen=new Set();let n=0;
  SYNERGIES.forEach(s=>{
    if(build.includes(s.a)&&build.includes(s.b)){
      const k=[s.a,s.b].sort().join('-');
      if(!seen.has(k)){seen.add(k);n++;}
    }
  });
  document.getElementById('spill').innerHTML=`<span class="syn-cnt">${n}</span> ${n===1?'synergy':'synergies'}`;
}

init();
</script>
</body>
</html>
