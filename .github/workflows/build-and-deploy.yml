# ═══════════════════════════════════════════════════════════════════════════
#  Crossworlds BCE — CI/CD Pipeline
#
#  Triggers: push to main (auto), or manual via Actions tab.
#
#  Jobs:
#    build-server  → Linux dedicated server → VPS deploy (with auto-rollback)
#    build-client  → Windows client → GitHub Release (latest)
#
#  One-time setup — add these secrets in GitHub → Settings → Secrets → Actions:
#
#    UNITY_LICENSE   Export from Unity Hub: Help → Manage License → Export .ulf
#    UNITY_EMAIL     Your Unity account email
#    UNITY_PASSWORD  Your Unity account password
#    VPS_HOST        15.204.243.36
#    VPS_SSH_KEY     Private SSH key for ubuntu@VPS_HOST
#                    (generate a deploy key: ssh-keygen -t ed25519 -C "github-actions"
#                     add the PUBLIC key to ~/.ssh/authorized_keys on the VPS)
#
#  Stable client download URL (share with friends):
#    https://github.com/<owner>/<repo>/releases/latest/download/Crossworlds-Windows.zip
# ═══════════════════════════════════════════════════════════════════════════

name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # also triggerable manually from the Actions tab
  schedule:
    # Daily rebuild + redeploy of main. GitHub cron is UTC with no DST
    # awareness, so this fixed time = 6:00am EDT (summer) / 5:00am EST (winter).
    - cron: '0 10 * * *'

# Only one build+deploy at a time: a new push to main cancels an in-progress
# run so the VPS only ever receives the latest commit (no racing deploys).
concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN needs write access so the client job can create/update the Release.
permissions:
  contents: write

jobs:

  # ── Dedicated Server → VPS ───────────────────────────────────────────────
  build-server:
    name: Server → VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library (Linux Server)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-LinuxServer-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-LinuxServer-

      - name: Build dedicated server
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildMethod:    BuildScript.BuildDedicatedServer
          versioning:     None

      # BuildScript already emits CrossWords.x86_64 / CrossWords_Data — the exact
      # names the live crossworlds-server unit's ExecStart expects. No rename here.
      - name: Pack server tarball
        run: |
          OUT=build/DedicatedServer
          # game-ci builds inside Docker as root, so the whole build/ dir is
          # root-owned; take ownership of it all before we chmod the binary AND
          # write the tarball into build/ (runner has sudo).
          sudo chown -R "$(id -u):$(id -g)" build
          chmod +x "$OUT/CrossWords.x86_64"
          tar -czf build/crossworlds-server.tar.gz \
            -C "$OUT" \
            --exclude "*_BackUpThisFolder_ButDontShipItWithYourGame" \
            --exclude "*_BurstDebugInformation_DoNotShip" \
            .
          echo "Packed: $(du -sh build/crossworlds-server.tar.gz | cut -f1)"

      - name: Upload tarball + deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ubuntu
          key:      ${{ secrets.VPS_SSH_KEY }}
          source:   "build/crossworlds-server.tar.gz,tools/deploy-server.sh"
          target:   /home/ubuntu/deploy/
          strip_components: 0

      - name: Deploy on VPS (auto-rollback on failure)
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ubuntu
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cp /home/ubuntu/deploy/build/crossworlds-server.tar.gz /home/ubuntu/crossworlds-server.tar.gz
            cp /home/ubuntu/deploy/tools/deploy-server.sh           /home/ubuntu/deploy-server.sh
            cd /home/ubuntu
            sudo bash deploy-server.sh
            echo "=== Health check ==="
            curl -sf http://localhost:3000/api/health && echo "Auth API OK" || echo "Auth API not responding (non-fatal)"

  # ── Windows Client → GitHub Release ─────────────────────────────────────
  build-client:
    name: Client → GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library (Windows)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Windows-

      - name: Build Windows client
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildMethod:    BuildScript.BuildWindowsClient
          versioning:     None

      - name: Zip client
        run: |
          cd build/WindowsClient
          zip -r ../../Crossworlds-Windows.zip .
          echo "Packed: $(du -sh ../../Crossworlds-Windows.zip | cut -f1)"

      - name: Publish to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          files: Crossworlds-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
