[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robinhood-crypto-bot"
version = "0.1.0"
description = "Recommendation-first crypto research and paper-trading system for Robinhood"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cryptography>=43,<51", "websockets>=15,<16"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
rh-crypto-bot = "rh_crypto_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rh_crypto_bot = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
